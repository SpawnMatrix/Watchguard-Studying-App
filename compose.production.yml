name: watchguard-study

services:
  watchguard-study-portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: "${WATCHGUARD_IMAGE_TAG:-local}"
        BUILD_DATE: "${WATCHGUARD_BUILD_DATE:-unknown}"
    image: watchguard-study-portal:${WATCHGUARD_IMAGE_TAG:-local}
    container_name: watchguard-study-portal
    restart: unless-stopped
    ports:
      - "${WATCHGUARD_HOST_PORT:-3001}:3000"
    environment:
      DATA_DIR: /data
      PORT: "3000"
      NODE_ENV: production
      ENABLE_AI_FEATURES: "${ENABLE_AI_FEATURES:-false}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_BOOTSTRAP_USER: "${ADMIN_BOOTSTRAP_USER:-}"
      # Behind a TLS-terminating reverse proxy (Pangolin), so one hop is
      # trusted for client-IP attribution and cookies are always Secure.
      TRUSTED_PROXY_HOPS: "${TRUSTED_PROXY_HOPS:-1}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
    volumes:
      - study-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  study-data:
