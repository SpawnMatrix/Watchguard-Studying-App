name: watchguard-study

services:
  watchguard-study-portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: "${WATCHGUARD_IMAGE_TAG:-local}"
        BUILD_DATE: "${WATCHGUARD_BUILD_DATE:-unknown}"
    image: watchguard-study-portal:${WATCHGUARD_IMAGE_TAG:-local}
    container_name: watchguard-study-portal
    restart: unless-stopped
    ports:
      # Published on all interfaces by default. Binding this to 127.0.0.1 in 1.3.1 took the
      # portal off the air: Pangolin reaches the app from its own network namespace, not from
      # the host loopback, so the proxy could no longer connect and every request became a
      # Bad Gateway. Reachability beats the hardening it was meant to add.
      #
      # The exposure that change addressed is real and still open: with TRUSTED_PROXY_HOPS set,
      # a client that reaches this port directly can present its own X-Forwarded-For and choose
      # the address the rate limiters key on. Close it at the host firewall, or by putting the
      # proxy on the same Docker network and binding WATCHGUARD_HOST_BIND=127.0.0.1 then.
      - "${WATCHGUARD_HOST_BIND:-0.0.0.0}:${WATCHGUARD_HOST_PORT:-3001}:3000"

    environment:
      DATA_DIR: /data
      PORT: "3000"
      NODE_ENV: production
      ENABLE_AI_FEATURES: "${ENABLE_AI_FEATURES:-false}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_BOOTSTRAP_USER: "${ADMIN_BOOTSTRAP_USER:-}"
      # Behind a TLS-terminating reverse proxy (Pangolin), so one hop is
      # trusted for client-IP attribution and cookies are always Secure.
      TRUSTED_PROXY_HOPS: "${TRUSTED_PROXY_HOPS:-1}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
    volumes:
      - study-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A single Node process serving a SQLite-backed study portal. The ceiling is here so a
    # runaway request or a dependency defect cannot take the Proxmox host down with it; the
    # reservation keeps it schedulable alongside whatever else runs on the box.
    deploy:
      resources:
        limits:
          memory: ${WATCHGUARD_MEMORY_LIMIT:-1G}
          cpus: "${WATCHGUARD_CPU_LIMIT:-1.0}"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  study-data:
