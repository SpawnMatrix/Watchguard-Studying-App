<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WatchGuard Study Portal">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3440"/>
      <stop offset="1" stop-color="#151a21"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#d6360a"/>
    </linearGradient>
  </defs>
  <!-- Shield: the portal is a security study tool, so the mark reads as protection first. -->
  <path d="M32 3 58 12v22c0 12.8-9.8 22.6-26 27C15.8 56.6 6 46.8 6 34V12z" fill="url(#plate)" stroke="url(#edge)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Inspected packet path: three hops through a filtering point. -->
  <path d="M15 32h9" stroke="#ff6a1f" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M40 32h9" stroke="#ff6a1f" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="8.5" fill="none" stroke="#ff8a4c" stroke-width="3.6"/>
  <path d="M27.6 32.2l3.1 3.2 5.9-6.6" fill="none" stroke="#ffd9c2" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="16" r="2.6" fill="#ff6a1f"/>
  <circle cx="32" cy="47" r="2.6" fill="#ff6a1f"/>
</svg>
