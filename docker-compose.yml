services:
  watchguard-study-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchguard-study-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ENABLE_AI_FEATURES=true
      - GEMINI_API_KEY=your_gemini_api_key_here
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
