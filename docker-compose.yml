services:
  watchguard-study-portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: "${WATCHGUARD_IMAGE_TAG:-local}"
        BUILD_DATE: "${WATCHGUARD_BUILD_DATE:-unknown}"
    container_name: watchguard-study-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATA_DIR=/data
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_BOOTSTRAP_USER=${ADMIN_BOOTSTRAP_USER:-}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-0}
      # This compose file is the "run it directly" path, commonly over plain
      # HTTP on a LAN. Secure cookies are opt-in here and default-on in
      # compose.production.yml, which sits behind TLS.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - PORT=3000
      - NODE_ENV=production
      - ENABLE_AI_FEATURES=${ENABLE_AI_FEATURES:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - study-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # This file is the direct, no-proxy path, so the port is deliberately published on all
    # interfaces and TRUSTED_PROXY_HOPS stays 0 (no X-Forwarded-For is believed). The ceiling
    # still applies: a runaway process should not be able to take the host with it.
    deploy:
      resources:
        limits:
          memory: ${WATCHGUARD_MEMORY_LIMIT:-512M}
          cpus: "${WATCHGUARD_CPU_LIMIT:-1.0}"
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  study-data:
