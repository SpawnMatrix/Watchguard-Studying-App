services:
  watchguard-study-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchguard-study-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ENABLE_AI_FEATURES=${ENABLE_AI_FEATURES:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
