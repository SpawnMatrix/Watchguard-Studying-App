name: Study regression checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release files
        run: node scripts/check-release.mjs --current
      - name: Require a new version for this pull request
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-release.mjs "$RELEASE_BASE_SHA"
  test:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  a11y:
    # axe-core against every section in both themes, on the production build. Contrast regressions
    # fail here rather than shipping; scripts/a11y-allowlist.json is where an exception is explained.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the production build
        run: |
          mkdir -p "$RUNNER_TEMP/a11y-data"
          NODE_ENV=production PORT=3000 COOKIE_SECURE=false ENABLE_AI_FEATURES=false DATA_DIR="$RUNNER_TEMP/a11y-data" nohup node dist/server.cjs > "$RUNNER_TEMP/a11y-server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/a11y-server.log"; exit 1
      - name: Check every section in both themes
        env:
          A11Y_URL: http://127.0.0.1:3000
        run: npm run a11y
      - name: Verify per-track downloads and saved quizzes
        env:
          A11Y_URL: http://127.0.0.1:3000
        run: node scripts/check-track-chunks.mjs
  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build --build-arg COMMIT_SHA=ci-smoke --build-arg BUILD_DATE=ci -t study-test .
      - name: Assert build tools are absent from the production image
        run: >-
          docker run --rm --entrypoint node study-test -e
          "for (const name of ['vite', '@vitejs/plugin-react', '@tailwindcss/vite']) {
          try { require.resolve(name); } catch (e) { if (e.code === 'MODULE_NOT_FOUND') continue; throw e; }
          throw new Error(name + ' is installed in production'); }"
      - name: Start production image with persistent data
        run: docker run -d --name study-smoke -p 3000:3000 -e ENABLE_AI_FEATURES=false -v study-smoke-data:/data study-test
      - name: Wait for health and test study flows
        env:
          SMOKE_EXPECT_COMMIT: ci-smoke
          SMOKE_EXPECT_BUILD_TIME: 'true'
          SMOKE_USERNAME: smoke_ci
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/session; then break; fi
            sleep 2
          done
          node scripts/smoke.mjs
      - name: Replace container and verify persisted account
        env:
          SMOKE_EXPECT_COMMIT: ci-smoke
          SMOKE_USERNAME: smoke_ci
          SMOKE_VERIFY: 'true'
          SMOKE_EXPECT_BUILD_TIME: 'true'
        run: |
          docker rm -f study-smoke
          docker run -d --name study-smoke -p 3000:3000 -e ENABLE_AI_FEATURES=false -v study-smoke-data:/data study-test
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/session; then break; fi
            sleep 2
          done
          node scripts/smoke.mjs
      - name: Container logs
        if: always()
        run: docker logs study-smoke
